name: Aktualizuj wiatr Czorsztyn

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: write

jobs:
  update-wind:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy xarray h5netcdf scipy

      - name: Pobierz WRF i przygotuj prognozę
        run: python update_wind.py

      - name: Zapisz nową prognozę
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Brak nowych danych."
          else
            git commit -m "Aktualizacja prognozy WRF Czorsztyn"
            git push
          fi
